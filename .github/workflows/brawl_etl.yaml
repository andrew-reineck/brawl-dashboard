name: Brawl Stars 80-Min ETL Sync

on:
  schedule:
    # Runs automatically every 80 minutes
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub UI

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inspect DB file
        run: |
          ls -la data/
          head -c 100 data/brawl_stars.db | xxd | head -5

      - name: Execute Ingestion Script
        env:
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
          BRAWL_STARS_PLAYER_TAG: ${{ secrets.BRAWL_STARS_PLAYER_TAG }}
        run: python scripts/etl.py

      - name: Commit and Push Updated SQLite DB
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brawl_stars.db
          # Only commit if changes exist to avoid empty commit failures
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: sync brawl stats [skip ci]" && git push)
